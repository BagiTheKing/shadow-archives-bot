name: Fetch Artifact

# Manual. Copies one run's artifact (e.g. a dry-run preview video) to the
# preview-media branch, so a review session that cannot reach GitHub's
# artifact storage can read it.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id"
        required: true
      name:
        description: "Artifact name, e.g. video-132"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Push to preview-media
        run: |
          cd out
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Artifact ${{ inputs.name }} from run ${{ inputs.run_id }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-media
