name: Fetch Artifact

# Manual. Copies one run's artifact (e.g. a dry-run preview video) to the
# preview-media branch, so a review session that cannot reach GitHub's
# artifact storage can read it.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Workflow run id"
        required: true
      name:
        description: "Artifact name, e.g. video-132"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}
          path: out
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      # A long video is too large for a branch (GitHub refuses files over
      # 100 MB): it is brought down to a 720p review copy, and the scene
      # clips that ride along in the artifact are dropped.
      - name: Shrink a long video for review
        run: |
          [ -f out/final_longform.mp4 ] || exit 0
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -y -loglevel error -i out/final_longform.mp4 -vf scale=1280:-2 \
            -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 96k out/longform_review.mp4
          rm -f out/final_longform.mp4 out/lf_clip_*.mp4
          ls -la out
      - name: Push to preview-media
        run: |
          cd out
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Artifact ${{ inputs.name }} from run ${{ inputs.run_id }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-media
