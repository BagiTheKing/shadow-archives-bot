name: Check Keys

# Manual. Tests the Gemini keys and the Wikimedia token (tools/check_keys.py)
# without printing them. A few model requests, nothing uploaded.
on:
  workflow_dispatch:
    inputs:
      which:
        description: 'What to check: gemini wikimedia github cloudflare'
        default: 'gemini wikimedia github'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/check_keys.py ${{ inputs.which }}
