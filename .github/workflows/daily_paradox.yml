name: Daily Paradox Short

# The channel's one format from 5 Nov 2026 (owner: "one short for every day,
# no long form videos at all, unless there is a big event"; agreed: 5 a week,
# each one reviewed by the owner before it is posted).
#
# Builds today's NOW / THEN Short (tools/daily_paradox.py, then
# tools/paradox_short.py) and pushes it to preview-media for review, with its
# title, description and first comment in short_meta.json. NOTHING IS POSTED
# HERE: once the owner approves, Upload Short posts it
# (meta_file: preview-media:short_meta.json, file: short.mp4).
#
# Monday to Friday at 08:47 UTC: after the free Gemini quota resets, and early
# enough for the review to land the same day.
on:
  schedule:
    - cron: '47 8 * * 1-5'
  workflow_dispatch:
    inputs:
      voice:
        description: "Kokoro voice"
        required: false
        default: am_onyx

concurrency:
  group: daily-paradox
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg espeak-ng
          pip install -r requirements.txt
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files
      - name: Fetch Kokoro model files (cache miss only)
        run: |
          mkdir -p models
          [ -f models/kokoro-v1.0.onnx ] || curl -sSL -o models/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
      - name: Choose today's story, write it, pick the pictures
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          HISTORY_CUTOFF_YEAR: '2010'
          SHORTS_FACTS: require
        run: python tools/daily_paradox.py out
      - name: Build the Short
        env:
          KOKORO_VOICE: ${{ inputs.voice || 'am_onyx' }}
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
        run: |
          python tools/paradox_short.py out/story out
          # one frame a second, for the review
          ffmpeg -loglevel error -y -i out/short.mp4 -vf "fps=1,scale=216:-1,tile=8x6" -frames:v 1 out/frames.jpg
      - name: Push to preview-media for review
        if: always()
        run: |
          [ -d out ] || exit 0
          cd out
          rm -rf work story/*.jpg
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Daily Paradox Short (run ${{ github.run_number }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-media
