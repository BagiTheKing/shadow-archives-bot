name: Preview Clips

# Manual. Renders the clips of one video twice, the current way (main) and
# the proposed way (this branch), from the scenes they need, for a side by
# side look. Nothing is uploaded; the clips go to the preview-media branch.
on:
  workflow_dispatch:
    inputs:
      script_run:
        description: "Run id whose script to use (blank: the script on preview-media)"
        required: false
        default: ""
      script_artifact:
        description: "That run's script artifact, e.g. timely-script-69"
        required: false
        default: ""
      mode:
        description: "compare (old and new clips) or teaser (the new teaser only, ready to post)"
        required: false
        default: "compare"

permissions:
  contents: write
  actions: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg and espeak-ng
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      # ~355MB combined, so cached rather than pulled on every run. The key
      # never changes unless the model version does, so after the first run
      # this step is a cache hit and the fetch below is skipped entirely.
      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-model-files

      # Map beat data (src/map_engine.py): Natural Earth 1:10m countries,
      # provinces and places, public domain, ~58MB. map_engine downloads
      # whatever is missing; this cache just means it happens once.
      - name: Cache Natural Earth map data
        uses: actions/cache@v4
        with:
          path: models/naturalearth
          key: naturalearth-10m-v1

      - name: Fetch Kokoro model files (cache miss only)
        run: |
          mkdir -p models
          if [ ! -f models/kokoro-v1.0.onnx ]; then
            curl -sSL -o models/kokoro-v1.0.onnx "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx"
          fi
          if [ ! -f models/voices-v1.0.bin ]; then
            curl -sSL -o models/voices-v1.0.bin "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin"
          fi

      # Cast cards (src/cast_engine.py): person cut-out (u2net_human_seg,
      # Apache-2.0), face detection (YuNet) and face matching (SFace) from
      # the OpenCV model zoo. ~215MB, fetched once. Any missing file only
      # turns off the step that needs it.
      - name: Cache cast-card models
        uses: actions/cache@v4
        with:
          path: models/cast
          key: cast-models-v1

      - name: Fetch cast-card models (cache miss only)
        run: |
          mkdir -p models/cast
          cd models/cast
          [ -f u2net_human_seg.onnx ] || curl -sSL -o u2net_human_seg.onnx "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx" || true
          [ -f face_detection_yunet_2023mar.onnx ] || curl -sSL -o face_detection_yunet_2023mar.onnx "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" || true
          [ -f face_recognition_sface_2021dec.onnx ] || curl -sSL -o face_recognition_sface_2021dec.onnx "https://media.githubusercontent.com/media/opencv/opencv_zoo/main/models/face_recognition_sface/face_recognition_sface_2021dec.onnx" || true
          # a failed download must not leave an error page posing as a model
          for f in *.onnx; do [ "$(stat -c%s "$f")" -gt 100000 ] || rm -f "$f"; done
          ls -la

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Progress of a run that died (run_cache.py): the next run of this
      # lane carries on from it instead of paying for the same research and
      # chapters twice. Kept on the run-cache branch, one folder per lane.
      - name: Download a past run's script
        if: inputs.script_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.script_artifact }}
          path: past_script
          run-id: ${{ inputs.script_run }}
          github-token: ${{ github.token }}

      - name: Fetch the script and the current clip code
        run: |
          git fetch -q origin preview-media main
          if [ -f past_script/longform_script.json ]; then
            cp past_script/longform_script.json preview_script.json
          else
            git show origin/preview-media:longform_script.json > preview_script.json
          fi
          git show origin/main:src/longform_clips.py > src/longform_clips_old.py

      - name: Render both versions
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          WIKIMEDIA_TOKEN: ${{ secrets.WIKIMEDIA_TOKEN }}
          KOKORO_VOICE: am_onyx
          # the teaser's paradox line is written by the same free chain
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LONGFORM_CLIPS: '4'
        run: python tools/preview_clips.py preview_script.json out "${{ inputs.mode || 'compare' }}"

      - name: Push to preview-media
        run: |
          cp preview_script.json out/longform_script.json
          cd out
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Clip preview (run ${{ github.run_number }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-media
