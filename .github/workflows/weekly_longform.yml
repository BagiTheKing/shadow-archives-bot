name: Weekly Long-Form — Encore Lane

# Lane 1 of 2. Expands whichever Short actually earned the most likes, so the
# deep dive follows the channel's own numbers instead of the date rotation.
# Lane 2 is weekly_timely.yml.

on:
  schedule:
    # Tuesdays 09:00 UTC. Moved off Sunday: OpenRouter's free tier is 50
    # requests per DAY across everything, and Sunday also publishes a Short.
    # Tuesday and Thursday are the only days with no other run.
    #
    # This lane normally picks its topic from the channel's own numbers, so the
    # day does not matter. LONGFORM_TOPIC_OFFSET only feeds the fallback.
    - cron: '0 9 * * 2'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Render only, do not upload (dry run)'
        type: boolean
        default: false
      topic_offset:
        description: 'Days back in the topic rotation (default -7)'
        type: string
        default: '-7'

concurrency:
  group: weekly-longform
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # The repo is private, so minutes are metered against 2,000/month. A healthy
    # run is ~60 min; this ceiling stops a hung ffmpeg or a Pollinations
    # rate-limit spiral from quietly eating a fifth of the monthly budget.
    timeout-minutes: 150

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run long-form pipeline
        id: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional and the biggest script-quality upgrade available: a free
          # Google AI Studio key (https://aistudio.google.com/apikey) switches
          # the writer from OpenRouter's free models to Gemini's free tier.
          # Absent, the pipeline uses OpenRouter exactly as before.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # More free writers, each with its own daily allowance. The chain is
          # gemini -> groq -> cerebras -> zhipu -> openrouter, and a provider
          # that runs dry now retires itself and hands over instead of ending
          # the run. All free, none need a card:
          #   https://console.groq.com/keys
          #   https://cloud.cerebras.ai
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Independent of every provider above — a separate company, on
          # its own infrastructure, not sitting behind OpenRouter the way
          # most of the free chain ultimately does. GLM-4.7-Flash and
          # GLM-4.5-Flash are genuinely free (not trial credit), confirmed
          # across several independent sources. Sign up at https://z.ai/
          # model-api (email only) — NOT open.bigmodel.cn, which is a
          # separate mainland-China portal requiring a verified Chinese
          # phone number and real-name ID.
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Last in the chain and the only tier that bills, so nothing reaches
          # it until every free allowance above is spent. Leave the secret
          # unset to keep the pipeline entirely free. NOTE: a Claude Pro
          # subscription is a chat plan and does not issue an API key — this
          # needs a pay-as-you-go key from https://console.anthropic.com.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional, and the biggest available quality upgrade: a free
          # Cloudflare account unlocks FLUX-1-schnell via Workers AI, which
          # renders the same prompts far more cleanly than the keyless
          # endpoint. Absent, the pipeline falls back to Pollinations exactly
          # as before. Create a token with the "Workers AI" template at
          # https://dash.cloudflare.com/profile/api-tokens
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Optional. A free key from https://www.pexels.com/api/ unlocks muted
          # real b-roll clips between the stills. Absent, the pipeline simply
          # uses no stock video — nothing fails.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # PUBLIC since 2026-08-18. Every long-form video before this date was
          # published unlisted, which is why seven of them total ~90 views: they
          # were never visible to anyone who did not have the link. Nothing about
          # the content was the problem. Keep this 'public'.
          PRIVACY_STATUS: public
          # Named in the description so both formats read as one
          # channel. Not put in the long-form title on purpose —
          # these videos live on search, and a prefix pushes the
          # searchable words past where YouTube truncates them.
          SERIES_NAME: Catastrophe Files
          EXPERIMENT_EVERY: '0'
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
          LONGFORM_LANE: encore
          LONGFORM_TOPIC_OFFSET: ${{ inputs.topic_offset || '-7' }}
        run: python src/longform_main.py

      # Diagnostics only — never allowed to fail the run. Same reasoning as the
      # Shorts workflow: whether we can save a debug copy must not decide whether
      # a published video counts as a success.
      - name: Upload script for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: longform-script-${{ github.run_number }}
          path: build/longform_script.json
          if-no-files-found: ignore
          retention-days: 7

      # Raw replies from any model whose output would not parse. A few KB, and
      # the only way to see what a model actually sent — the run log truncates
      # the error to a line and throws the reply away.
      - name: Upload unparseable model replies
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: longform-llm-failures-${{ github.run_number }}
          path: build/llm_failures/
          if-no-files-found: ignore
          retention-days: 7

      # NOT uploaded on failure, unlike the Shorts workflow. An eight-minute
      # 1080p render is 200-400 MB against a 500 MB account-wide quota, so one
      # stray copy would refill the wall we just cleared. Dry runs only, one day.
      - name: Upload thumbnail for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: longform-thumbnail-${{ github.run_number }}
          path: build/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload rendered video (explicit dry runs only)
        if: always() && inputs.skip_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: longform-video-${{ github.run_number }}
          path: build/final_longform.mp4
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
