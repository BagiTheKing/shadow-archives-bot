# .github/workflows/daily_publish.yml
name: Daily YouTube Shorts Publisher

on:
  schedule:
    - cron: '0 15 * * *' # Executes automatically every day at 3:00 PM UTC
  workflow_dispatch: # Allows manual triggering from the GitHub UI for testing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # FIX: key was 'python-module-version' (invalid, silently ignored)
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          echo "🧹 Wiping cached libraries..."
          pip uninstall -y openai httpx
          echo "⬇️ Force-installing correct dependency chain..."
          pip install --upgrade "openai>=1.56.0" "httpx==0.27.2" "gTTS==2.5.1" requests==2.31.0 google-api-python-client==2.122.0 google-auth-oauthlib==1.2.0 google-auth-httplib2==0.2.0          echo "🚀 Starting Python engine..."
          python src/main.py

      # Keep the rendered video as a downloadable artifact even if upload fails —
      # invaluable for debugging without re-running the whole pipeline
      - name: Upload build artifact (debugging aid)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-short
          path: build/final_short.mp4
          if-no-files-found: ignore
          retention-days: 3
