# .github/workflows/daily_publish.yml
name: Daily YouTube Shorts Publisher

on:
  schedule:
    - cron: '0 15 * * *' # Executes automatically every day at 3:00 PM UTC
  workflow_dispatch: # Allows manual triggering from the GitHub UI for testing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-module-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Automation Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/main.py
