name: Daily YouTube Shorts Publisher

on:
  schedule:
    # Five uploads a week (Mon, Wed, Fri, Sat, Sun) instead of seven.
    # The view decline across the first 29 uploads tracked hook quality, not
    # posting frequency, so the two skipped days buy render budget and give the
    # topic pool room to last. Day numbers: 0=Sun ... 6=Sat.
    - cron: '23 15 * * 1,3,5,6,0'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Render only, do not upload (dry run)'
        type: boolean
        default: false
      force_publish:
        description: 'Publish even if something was uploaded in the last 20h'
        type: boolean
        default: false

# Two runs writing to the same channel on the same day is never wanted.
#
# `concurrency` only stops two runs that OVERLAP. It did nothing about the
# failure that actually happened: a manual run at 14:02 finishing cleanly, then
# the scheduled run at 15:23 starting fresh, landing on the same date-based
# topic, and publishing a reworded copy two hours later. That happened three
# times (Light Brigade, Ariane 5, the Great Fire). The real guard is in
# src/published_history.py, which reads the channel back and stands the run
# down if anything went out inside the last 20 hours. Manual triggers are safe
# now; use force_publish only when you mean it.
concurrency:
  group: daily-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # This was the only workflow with no ceiling, so a hung run inherited
    # GitHub's 6-hour default. On 2026-08-19 two runs had to be killed by hand
    # at 79 and 77 minutes — 157 minutes for nothing, against a 2,000/month
    # budget on a private repo.
    #
    # 50, not 30. Across all 68 runs to date the slowest SUCCESSFUL publish was
    # 41.7 min and the median was 13.1, so a 30-minute cap would have thrown
    # away two videos that did finish. 50 clears the worst good run with room
    # to spare and still turns a hang into 50 wasted minutes instead of 360.
    timeout-minutes: 50
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation pipeline
        id: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional and the biggest script-quality upgrade available: a free
          # Google AI Studio key (https://aistudio.google.com/apikey) switches
          # the writer from OpenRouter's free models to Gemini's free tier.
          # Absent, the pipeline uses OpenRouter exactly as before.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # More free writers, each with its own daily allowance. The chain is
          # gemini -> groq -> cerebras -> openrouter, and a provider that runs
          # dry now retires itself and hands over instead of ending the run.
          # Both are free and neither needs a card:
          #   https://console.groq.com/keys
          #   https://cloud.cerebras.ai
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          # Last in the chain and the only tier that bills, so nothing reaches
          # it until every free allowance above is spent. Leave the secret
          # unset to keep the pipeline entirely free. NOTE: a Claude Pro
          # subscription is a chat plan and does not issue an API key — this
          # needs a pay-as-you-go key from https://console.anthropic.com.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional, and the biggest available quality upgrade: a free
          # Cloudflare account unlocks FLUX-1-schnell via Workers AI, which
          # renders the same prompts far more cleanly than the keyless
          # endpoint. Absent, the pipeline falls back to Pollinations exactly
          # as before. Create a token with the "Workers AI" template at
          # https://dash.cloudflare.com/profile/api-tokens
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: public
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
          # The channel's recurring format. Every Short is published as
          # "Catastrophe Files #N — ...", numbered from what is already on the
          # channel, so a viewer has a reason to expect another one. Set to an
          # empty string to publish unnamed episodes again.
          SERIES_NAME: Catastrophe Files
          # 0 = catastrophe-decision stories only. A 30-day single-identity
          # test; set to 7 to bring the experiment lane back (see src/topics.py
          # for the numbers on both sides of that call).
          EXPERIMENT_EVERY: '5'
          # Overrides the duplicate guard. Only ever set from the dispatch
          # input, never on the schedule.
          FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '0' }}
          # Checks the live catalogue before committing to a topic: how many
          # Shorts on the same subject already cleared 100k views this year.
          # Costs ~101 Data API units per candidate (search.list is 100) and is
          # capped at 3 candidates a run, against a 10,000/day allowance shared
          # with the upload itself. Set to 0 to run on the static ratings alone.
          MEASURE_SATURATION: '1'
          # The closing question is spoken and captioned, not just posted as a
          # comment. This is the one change that can cost retention — set to 0
          # if the last-second drop-off gets worse.
          SPEAK_QUESTION: '1'
        run: python src/main.py

      # ---- Artifacts, sized for the 0.5 GB Actions storage allowance ----
      # The old step kept the rendered MP4 (~25-50 MB) from EVERY run for 5 days,
      # including successful publishes where the video already lives on YouTube.
      # That is what filled the quota. The script is a few KB, so it stays.

      # continue-on-error on both: these artifacts are diagnostics, not the
      # deliverable. Run #45 published to YouTube successfully and was still
      # marked failed because the artifact quota was full, which also made
      # failure() true and dragged the video-upload step in behind it.
      # Whether we can save a debug copy must never decide whether the run passed.

      - name: Upload script for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: script-${{ github.run_number }}
          path: build/script.json
          if-no-files-found: ignore
          retention-days: 7

      # Keyed to the pipeline step specifically, not failure(), so a failed
      # artifact upload cannot trigger another artifact upload.
      - name: Upload rendered video (dry runs and failures only)
        if: always() && (steps.pipeline.outcome == 'failure' || inputs.skip_upload)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: build/final_short.mp4
          if-no-files-found: ignore
          # MP4 is already compressed; skipping zip compression saves CI time
          # and produces no meaningful size difference.
          compression-level: 0
          retention-days: 2
