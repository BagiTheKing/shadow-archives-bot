name: Daily YouTube Shorts Publisher

on:
  schedule:
    - cron: '23 15 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Render only, do not upload (dry run)'
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: public   # flip to 'public' once you're happy with quality
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
        run: python src/main.py

      - name: Upload build artifacts (video + script for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short
          path: |
            build/final_short.mp4
            build/script.json
          if-no-files-found: ignore
          retention-days: 5
