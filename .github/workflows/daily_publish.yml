name: Daily YouTube Shorts Publisher

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Fixed key to ensure correct environment
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        # --no-cache-dir forces GitHub to download the fresh, corrected packages
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run Automation Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/main.py

      - name: Upload Final Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-archives-video
          path: build/final_short.mp4
