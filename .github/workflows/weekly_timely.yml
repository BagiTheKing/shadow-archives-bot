name: Weekly Long-Form — Trending Lane

# Lane 2 of 2. Picks a subject that is genuinely hot this week (Google Trends
# crossed with Google News), then tells the HISTORY behind it.
#
# The separation is the whole design. The trend chooses the subject; it never
# supplies the content. A headline about the Spanish-Moroccan border becomes a
# documentary about the 1415 capture of Ceuta, not a take on this week's events.
# longform_llm enforces that with a cutoff year checked against the model's
# chosen anchor AND against the narration it then writes, because this pipeline
# publishes without anyone reading the script first.

on:
  schedule:
    # Wednesdays 09:00 UTC — mid-week, so it reads a fresh trend cycle and sits
    # well away from Sunday's encore run and the daily 15:23 Shorts run.
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Render only, do not upload (dry run)'
        type: boolean
        default: false
      trend_geos:
        description: 'Override Trends regions, e.g. MA,ES (blank = weekly rotation)'
        type: string
        default: ''
      trend_editions:
        description: 'Override news editions, e.g. ZA,NG (blank = weekly rotation)'
        type: string
        default: ''

concurrency:
  group: weekly-timely
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trending long-form pipeline
        id: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # This lane reacts to live news, so it stays unlisted until a few
          # runs have been reviewed. Raise this bar deliberately, not by default.
          PRIVACY_STATUS: unlisted
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
          LONGFORM_LANE: timely
          TREND_GEOS: ${{ inputs.trend_geos }}
          TREND_EDITIONS: ${{ inputs.trend_editions }}
          # Nothing after this year may appear in the narration.
          HISTORY_CUTOFF_YEAR: '2005'
        run: python src/longform_main.py

      - name: Upload script for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timely-script-${{ github.run_number }}
          path: build/longform_script.json
          if-no-files-found: ignore
          retention-days: 7

      # The thumbnail is a few hundred KB, unlike the 200-400 MB render, so it
      # is cheap to keep and it is the thing most worth eyeballing after a run.
      - name: Upload thumbnail for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timely-thumbnail-${{ github.run_number }}
          path: build/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload rendered video (explicit dry runs only)
        if: always() && inputs.skip_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timely-video-${{ github.run_number }}
          path: build/final_longform.mp4
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
