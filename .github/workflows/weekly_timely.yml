name: Weekly Long-Form — Trending Lane

# Lane 2 of 2. Picks a subject that is genuinely hot this week (Google Trends
# crossed with Google News), then tells the HISTORY behind it.
#
# The separation is the whole design. The trend chooses the subject; it never
# supplies the content. A headline about the Spanish-Moroccan border becomes a
# documentary about the 1415 capture of Ceuta, not a take on this week's events.
# longform_llm enforces that with a cutoff year checked against the model's
# chosen anchor AND against the narration it then writes, because this pipeline
# publishes without anyone reading the script first.

on:
  schedule:
    # Thursdays 09:00 UTC. Shorts publish Mon/Wed/Fri/Sat/Sun, so Tuesday and
    # Thursday are the only days with no other run — and OpenRouter's free tier
    # is 50 requests per DAY across everything. This lane was on Wednesday and
    # was sharing that budget with a Shorts run.
    - cron: '0 9 * * 4'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Render only, do not upload (dry run)'
        type: boolean
        default: false
      trend_geos:
        description: 'Override Trends regions, e.g. MA,ES (blank = weekly rotation)'
        type: string
        default: ''
      trend_editions:
        description: 'Override news editions, e.g. ZA,NG (blank = weekly rotation)'
        type: string
        default: ''

concurrency:
  group: weekly-timely
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run trending long-form pipeline
        id: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional and the biggest script-quality upgrade available: a free
          # Google AI Studio key (https://aistudio.google.com/apikey) switches
          # the writer from OpenRouter's free models to Gemini's free tier.
          # Absent, the pipeline uses OpenRouter exactly as before.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional, and the biggest available quality upgrade: a free
          # Cloudflare account unlocks FLUX-1-schnell via Workers AI, which
          # renders the same prompts far more cleanly than the keyless
          # endpoint. Absent, the pipeline falls back to Pollinations exactly
          # as before. Create a token with the "Workers AI" template at
          # https://dash.cloudflare.com/profile/api-tokens
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Optional. A free key from https://www.pexels.com/api/ unlocks muted
          # real b-roll clips between the stills. Absent, the pipeline simply
          # uses no stock video — nothing fails.
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # PUBLIC since 2026-08-18. Every long-form video before this date was
          # published unlisted, which is why seven of them total ~90 views: they
          # were never visible to anyone who did not have the link. Nothing about
          # the content was the problem. Keep this 'public'.
          PRIVACY_STATUS: public
          # Named in the description so both formats read as one
          # channel. Not put in the long-form title on purpose —
          # these videos live on search, and a prefix pushes the
          # searchable words past where YouTube truncates them.
          SERIES_NAME: Catastrophe Files
          EXPERIMENT_EVERY: '0'
          SKIP_UPLOAD: ${{ inputs.skip_upload && '1' || '0' }}
          LONGFORM_LANE: timely
          TREND_GEOS: ${{ inputs.trend_geos }}
          TREND_EDITIONS: ${{ inputs.trend_editions }}
          # Nothing after this year may appear in the narration.
          HISTORY_CUTOFF_YEAR: '2005'
        run: python src/longform_main.py

      - name: Upload script for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timely-script-${{ github.run_number }}
          path: build/longform_script.json
          if-no-files-found: ignore
          retention-days: 7

      # Raw replies from any model whose output would not parse. A few KB, and
      # the only way to see what a model actually sent — the run log truncates
      # the error to a line and throws the reply away.
      - name: Upload unparseable model replies
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timely-llm-failures-${{ github.run_number }}
          path: build/llm_failures/
          if-no-files-found: ignore
          retention-days: 7

      # The thumbnail is a few hundred KB, unlike the 200-400 MB render, so it
      # is cheap to keep and it is the thing most worth eyeballing after a run.
      - name: Upload thumbnail for review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timely-thumbnail-${{ github.run_number }}
          path: build/thumbnail.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload rendered video (explicit dry runs only)
        if: always() && inputs.skip_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: timely-video-${{ github.run_number }}
          path: build/final_longform.mp4
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
