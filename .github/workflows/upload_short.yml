name: Upload Short

# Manual. Publishes the native Short on the preview-media branch (native.mp4)
# that the owner approved, in the next free Shorts slot at or after
# not_before, with its first comment held until it is public.
on:
  workflow_dispatch:
    inputs:
      meta_file:
        description: "Title, description, comment and not_before (JSON in the repo)"
        required: true
      file:
        description: "The Short's file on preview-media (native.mp4, or short.mp4 from Paradox Short)"
        required: false
        default: native.mp4

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Fetch the approved Short
        run: |
          git fetch -q origin preview-media
          git show "origin/preview-media:${{ inputs.file || 'native.mp4' }}" > short.mp4
          ls -la short.mp4
      - name: Upload
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY_STATUS: public
        run: python tools/upload_short.py short.mp4 "${{ inputs.meta_file }}"
      - name: Hold the first comment until it is public
        continue-on-error: true
        run: |
          [ -f build/pending_comments.json ] || exit 0
          git fetch -q origin thumb-rotation
          git worktree add -q rot origin/thumb-rotation
          ROT_DIR=rot python tools/thumb_rotation.py comments build/pending_comments.json
          cd rot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Held first comment of an uploaded Short"
          git push -q origin HEAD:thumb-rotation
