name: Media Probe

# Manual. Searches DVIDS and Openverse for a few subjects and pushes contact
# sheets of what they return (and the raw replies) to the preview-media
# branch. Nothing is published.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "photos (contact sheets per source) or footage (frames of each clip)"
        required: false
        default: "photos"
      queries:
        description: "Subjects, separated by | (footage: one query)"
        required: true
        default: "Yemen|Houthi|Sanaa|Aden|Red Sea Houthi missile|Saudi airport attack|Yemen civil war 1994|Ali Abdullah Saleh"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -r requirements.txt
      - name: Search both sources
        env:
          DVIDS_API_KEY: ${{ secrets.DVIDS_API_KEY }}
          QUERIES: ${{ inputs.queries }}
        run: |
          if [ "${{ inputs.mode }}" = "footage" ]; then
            python tools/footage_sheet.py out "$QUERIES" 2026
          else
            IFS='|' read -ra Q <<< "$QUERIES"
            python tools/media_probe.py out "${Q[@]}"
          fi
      - name: Push to preview-media
        run: |
          cd out
          git init -q -b preview-media
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Media probe (run ${{ github.run_number }})"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-media
