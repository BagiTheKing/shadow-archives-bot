name: Tests

# The publishing workflows only run on a schedule, so a broken import can sit in
# main for days and then surface as a dead scheduled run — which is exactly how
# generate_longform_script went missing. This runs on every push instead, takes
# seconds, and makes no network calls.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check every pipeline module imports
        run: |
          cd src
          for f in *.py; do
            python -c "import importlib, sys; importlib.import_module('${f%.py}')" \
              || { echo "::error::${f} failed to import"; exit 1; }
          done
