name: Probe — Gemini native TTS (diagnostic only)

# NOT part of the pipeline. Answers, with a real call, whether Gemini's TTS
# response carries word-timing data and whether a natural-language style
# instruction changes anything, before any integration code gets written
# against assumptions. Delete this workflow and scripts/probe_gemini_tts.py
# once that decision is made.

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run probe
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/probe_gemini_tts.py
      - name: Upload probe audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-tts-probe-audio
          path: build/probe_*.wav
          if-no-files-found: ignore
          retention-days: 3
