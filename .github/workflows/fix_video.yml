name: Fix Video

# Manual only. Fixes one uploaded video's title, placeholder description
# lines, privacy or thumbnail, or posts a comment (a correction) as the
# channel, through the channel's credentials (tools/fix_video.py).

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id"
        required: true
      title:
        description: "New title (blank = keep)"
        default: ""
      intro:
        description: "Text replacing placeholder lines in the description"
        default: ""
      privacy:
        description: "public / unlisted / private (blank = keep)"
        default: ""
      thumbnail:
        description: "Thumbnail path on the thumb-rotation branch, e.g. videos/<id>/1_faceoff.jpg (blank = keep)"
        default: ""
      comment:
        description: "Comment to post as the channel, e.g. a correction (blank = none)"
        default: ""

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Fetch thumbnails
        if: inputs.thumbnail != ''
        run: |
          git fetch -q origin thumb-rotation
          git worktree add -q rot origin/thumb-rotation
      - name: Fix
        env:
          THUMB: ${{ inputs.thumbnail != '' && format('rot/{0}', inputs.thumbnail) || '' }}
          VIDEO_ID: ${{ inputs.video_id }}
          TITLE: ${{ inputs.title }}
          INTRO: ${{ inputs.intro }}
          PRIVACY: ${{ inputs.privacy }}
          COMMENT: ${{ inputs.comment }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/fix_video.py
