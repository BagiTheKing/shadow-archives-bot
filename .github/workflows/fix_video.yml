name: Fix Video

# Manual only. Fixes one uploaded video's title, placeholder description
# lines and privacy through the channel's credentials (tools/fix_video.py).

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id"
        required: true
      title:
        description: "New title (blank = keep)"
        default: ""
      intro:
        description: "Text replacing placeholder lines in the description"
        default: ""
      privacy:
        description: "public / unlisted / private (blank = keep)"
        default: ""

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: Fix
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          TITLE: ${{ inputs.title }}
          INTRO: ${{ inputs.intro }}
          PRIVACY: ${{ inputs.privacy }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/fix_video.py
